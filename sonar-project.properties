sonar.organization=juusolatva
sonar.projectKey=juusolatva_branch_bench
sonar.projectName=branch-bench

sonar.sources=branch_bench.c
sonar.sourceEncoding=UTF-8

# Written by Build Wrapper and gcovr in .github/workflows/ci.yml
sonar.cfamily.compile-commands=build_wrapper_output/compile_commands.json
sonar.coverageReportPaths=coverage.xml

# Fail the CI scan step when the quality gate fails, instead of reporting
# it only in SonarQube Cloud's own check.
sonar.qualitygate.wait=true
