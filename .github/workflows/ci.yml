name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flags the benchmark needs (see AGENTS.md, "Critical Compiler Flags").
  BENCH_FLAGS: -std=c99 -O2 -fno-tree-vectorize -fno-if-conversion
  # Clang has no -fno-if-conversion (see AGENTS.md, "Compiler Support").
  CLANG_FLAGS: -std=c99 -O2 -fno-vectorize -fno-slp-vectorize
  WARN_FLAGS: -Wall -Wextra -pedantic -Werror
  # Small enough for CI; still runs Test 4's sanity check.
  SMALL_RUN: --size 64K --reps 2

jobs:
  gcc:
    name: GCC build and codegen (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Show compiler version
        run: gcc --version

      - name: Build
        run: gcc $BENCH_FLAGS $WARN_FLAGS -o branch_bench branch_bench.c

      - name: Build without perf support (non-Linux path)
        run: gcc $BENCH_FLAGS $WARN_FLAGS -U__linux__ -c -o /dev/null branch_bench.c

      - name: Run (small size)
        run: ./branch_bench $SMALL_RUN

      - name: Check Test 1-3 kernels keep real branches
        run: .github/scripts/check_kernels.sh ./branch_bench

  clang:
    name: Clang build and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Show compiler version
        run: clang --version

      - name: Build
        run: clang $CLANG_FLAGS $WARN_FLAGS -o branch_bench branch_bench.c

      - name: Run (small size)
        run: ./branch_bench $SMALL_RUN

      - name: clang --analyze
        run: |
          mkdir -p "$RUNNER_TEMP/analyze"
          cd "$RUNNER_TEMP/analyze"
          clang --analyze -std=c99 -Xclang -analyzer-werror "$GITHUB_WORKSPACE/branch_bench.c"

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan+UBSan, x86-64
            runner: ubuntu-24.04
            cc: gcc
            flags: -fno-tree-vectorize -fno-if-conversion -fsanitize=address,undefined
          - name: ASan+UBSan, arm64
            runner: ubuntu-24.04-arm
            cc: gcc
            flags: -fno-tree-vectorize -fno-if-conversion -fsanitize=address,undefined
          - name: MSan, x86-64
            runner: ubuntu-24.04
            cc: clang
            flags: -fno-vectorize -fno-slp-vectorize -fsanitize=memory -fsanitize-memory-track-origins
    runs-on: ${{ matrix.runner }}
    env:
      # 86 instead of the default 1, so a sanitizer report can't pass as an
      # expected "invalid option" exit in smoke_test.sh.
      ASAN_OPTIONS: exitcode=86:detect_leaks=1
      UBSAN_OPTIONS: exitcode=86:halt_on_error=1:print_stacktrace=1
      MSAN_OPTIONS: exitcode=86
    steps:
      - uses: actions/checkout@v7

      # No -Werror: sanitizer instrumentation causes false-positive warnings
      # (e.g. -Wmaybe-uninitialized); warnings are enforced by the gcc job.
      - name: Build
        run: >
          ${{ matrix.cc }} -std=c99 -O1 -g -fno-omit-frame-pointer
          -fno-sanitize-recover=all ${{ matrix.flags }}
          -o branch_bench_san branch_bench.c

      - name: Smoke test
        run: .github/scripts/smoke_test.sh ./branch_bench_san "$RUNNER_TEMP/smoke"

  sonarqube:
    name: Coverage and SonarQube Cloud
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for SonarQube's blame and new-code data

      - name: Install gcovr
        run: pipx install gcovr==8.6

      - name: Install Build Wrapper
        id: build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v8

      # Lets the perf code paths run if this VM exposes a PMU; harmless if not.
      - name: Allow perf counters
        run: sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Build with coverage under Build Wrapper
        run: >
          "${{ steps.build-wrapper.outputs.build-wrapper-binary }}"
          --out-dir build_wrapper_output
          gcc -std=c99 -O0 -g --coverage -fno-tree-vectorize -fno-if-conversion
          -o branch_bench_cov branch_bench.c

      - name: Smoke test
        run: .github/scripts/smoke_test.sh ./branch_bench_cov "$RUNNER_TEMP/smoke"

      - name: Coverage report
        run: gcovr --root . --filter branch_bench.c --sonarqube coverage.xml --print-summary

      # Secrets are not passed to pull requests from forks.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
