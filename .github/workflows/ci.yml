name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always
# finish, so every main commit gets CI and a SonarQube analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Flags the benchmark needs (see AGENTS.md, "Critical Compiler Flags").
  BENCH_FLAGS: -std=c99 -O2 -fno-tree-vectorize -fno-if-conversion
  # x86-64 only, as in run.sh: keeps every kernel jump off 32-byte boundaries
  # (JCC erratum, see AGENTS.md).
  JCC_FLAGS: -Wa,-mbranches-within-32B-boundaries,-malign-branch=jcc+fused+jmp+call+ret+indirect
  # Clang has no -fno-if-conversion (see AGENTS.md, "Compiler Support").
  CLANG_FLAGS: -std=c99 -O2 -fno-vectorize -fno-slp-vectorize
  WARN_FLAGS: -Wall -Wextra -pedantic -Werror
  # Small enough for CI; still runs Test 4's sanity check.
  SMALL_RUN: --size 64K --reps 2

jobs:
  gcc:
    name: GCC build and codegen (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show compiler version
        run: gcc --version

      - name: Build
        run: |
          if [ "$RUNNER_ARCH" = X64 ]; then BENCH_FLAGS="$BENCH_FLAGS $JCC_FLAGS"; fi
          gcc $BENCH_FLAGS $WARN_FLAGS -o branch_bench branch_bench.c

      - name: Build without perf support (non-Linux path)
        run: gcc $BENCH_FLAGS $WARN_FLAGS -U__linux__ -c -o /dev/null branch_bench.c

      - name: Run (small size)
        run: ./branch_bench $SMALL_RUN

      - name: Perf regression tests (no PMU required)
        run: |
          gcc $BENCH_FLAGS $WARN_FLAGS -o "$RUNNER_TEMP/perf_test" .github/scripts/perf_test.c
          "$RUNNER_TEMP/perf_test"

      - name: Check Test 1-3 kernels keep real branches
        run: .github/scripts/check_kernels.sh ./branch_bench

      - name: Check no kernel jump crosses a 32-byte boundary
        if: runner.arch == 'X64'
        run: |
          hits=$(.github/scripts/check_jcc.sh ./branch_bench)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::kernel jumps cross or end on a 32-byte boundary (JCC erratum)"
            exit 1
          fi

  clang:
    name: Clang build and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show compiler version
        run: clang --version

      - name: Build
        run: clang $CLANG_FLAGS $WARN_FLAGS -o branch_bench branch_bench.c

      - name: Run (small size)
        run: ./branch_bench $SMALL_RUN

      # Clang makes Tests 1-2 branchless (cmov in sum_threshold, sbb in
      # count_decisions), so check_kernels.sh must reject both. This proves
      # the checker still detects lost branches.
      - name: Kernel check rejects Clang's branchless Tests 1-2
        run: |
          out="$RUNNER_TEMP/check_kernels.txt"
          if .github/scripts/check_kernels.sh ./branch_bench > "$out"; then
            cat "$out"
            echo "check_kernels.sh accepted a Clang build"
            exit 1
          fi
          cat "$out"
          grep -q '^FAIL Test 1/4' "$out"
          grep -q '^FAIL Test 2' "$out"

      - name: clang --analyze
        run: |
          mkdir -p "$RUNNER_TEMP/analyze"
          cd "$RUNNER_TEMP/analyze"
          clang --analyze -std=c99 -Xclang -analyzer-werror "$GITHUB_WORKSPACE/branch_bench.c"

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan+UBSan, x86-64
            runner: ubuntu-24.04
            cc: gcc
            flags: -fno-tree-vectorize -fno-if-conversion -fsanitize=address,undefined
          - name: ASan+UBSan, arm64
            runner: ubuntu-24.04-arm
            cc: gcc
            flags: -fno-tree-vectorize -fno-if-conversion -fsanitize=address,undefined
          - name: MSan, x86-64
            runner: ubuntu-24.04
            cc: clang
            flags: -fno-vectorize -fno-slp-vectorize -fsanitize=memory -fsanitize-memory-track-origins
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # 86 instead of the default 1, so a sanitizer report can't pass as an
      # expected "invalid option" exit in smoke_test.sh.
      ASAN_OPTIONS: exitcode=86:detect_leaks=1
      UBSAN_OPTIONS: exitcode=86:halt_on_error=1:print_stacktrace=1
      MSAN_OPTIONS: exitcode=86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No -Werror: sanitizer instrumentation causes false-positive warnings
      # (e.g. -Wmaybe-uninitialized); warnings are enforced by the gcc job.
      - name: Build
        run: >
          ${{ matrix.cc }} -std=c99 -O1 -g -fno-omit-frame-pointer
          -fno-sanitize-recover=all ${{ matrix.flags }}
          -o branch_bench_san branch_bench.c

      - name: Smoke test
        run: .github/scripts/smoke_test.sh ./branch_bench_san "$RUNNER_TEMP/smoke"

  sonarqube:
    name: Coverage and SonarQube Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Only the scan step gets the token itself.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for SonarQube's blame and new-code data

      # requirements.txt pins gcovr and all its dependencies with hashes; pip
      # rejects any package that is missing from it or has another hash.
      - name: Install gcovr
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/pip" install --require-hashes -r .github/requirements.txt
          echo "$RUNNER_TEMP/gcovr/bin" >> "$GITHUB_PATH"

      - name: Install Build Wrapper
        id: build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

      # Lets the perf code paths run if this VM exposes a PMU; harmless if not.
      - name: Allow perf counters
        run: sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Build with coverage under Build Wrapper
        env:
          BUILD_WRAPPER: ${{ steps.build-wrapper.outputs.build-wrapper-binary }}
        run: >
          "$BUILD_WRAPPER"
          --out-dir build_wrapper_output
          gcc -std=c99 -O0 -g --coverage -fno-tree-vectorize -fno-if-conversion
          -DBUILD_FLAGS='"--coverage"' -DBUILD_COMMIT="\"$GITHUB_SHA\""
          -o branch_bench_cov branch_bench.c

      - name: Smoke test
        run: .github/scripts/smoke_test.sh ./branch_bench_cov "$RUNNER_TEMP/smoke"

      # The VM has no PMU or cpufreq, so fake them to cover those code paths.
      - name: Smoke test with faked perf counters and cpufreq
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -shared -fPIC \
            -o "$RUNNER_TEMP/fake_perf.so" .github/scripts/fake_perf.c -ldl
          export LD_PRELOAD="$RUNNER_TEMP/fake_perf.so"
          dir="$RUNNER_TEMP/smoke-fake"
          .github/scripts/smoke_test.sh ./branch_bench_cov "$dir"
          # Fails if the shim was not used: these lines need the counters.
          grep -q '^\*\*Cost per miss:\*\*' "$dir/report.md"
          grep -q '^\*\*Average clock during measurements:\*\*' "$dir/report.md"
          # Only some counters open.
          for ev in misses branches,cycles; do
            FAKE_PERF_EVENTS=$ev ./branch_bench_cov -t 1 $SMALL_RUN -o "$dir/part.md"
          done

      # When no data matches the filter, gcovr writes an empty report and exits
      # 0; the minimum (the quality gate's 80%) makes that fail here instead.
      - name: Coverage report
        run: >
          gcovr --root . --filter 'branch_bench\.c$'
          --sonarqube coverage.xml --print-summary --fail-under-line 80

      # Pull requests from forks get no secrets, and Dependabot's pull requests
      # get only Dependabot secrets, so SONAR_TOKEN must be both an Actions and
      # a Dependabot secret. The scan waits for the quality gate and fails the
      # job if it fails (sonar-project.properties).
      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Note skipped SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN != 'true'
        run: echo "::notice::SonarQube Cloud scan skipped (no SONAR_TOKEN, e.g. a pull request from a fork, or from Dependabot without the Dependabot secret)"
