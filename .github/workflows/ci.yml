name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always
# finish, so every main commit gets CI and a SonarQube analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Flags the benchmark needs (see AGENTS.md, "Critical Compiler Flags").
  BENCH_FLAGS: -std=c99 -O2 -fno-tree-vectorize -fno-if-conversion
  # x86-64 only, as in run.sh: keeps every kernel jump off 32-byte boundaries
  # (JCC erratum, see AGENTS.md).
  JCC_FLAGS: -Wa,-mbranches-within-32B-boundaries,-malign-branch=jcc+fused+jmp+call+ret+indirect
  # Clang has no -fno-if-conversion (see AGENTS.md, "Compiler Support").
  CLANG_FLAGS: -std=c99 -O2 -fno-vectorize -fno-slp-vectorize
  WARN_FLAGS: -Wall -Wextra -pedantic -Werror
  # Small enough for CI; still runs Test 4's sanity check.
  SMALL_RUN: --size 64K --reps 2

jobs:
  gcc:
    name: GCC build and codegen (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show compiler version
        run: gcc --version

      - name: Build
        run: |
          if [ "$RUNNER_ARCH" = X64 ]; then BENCH_FLAGS="$BENCH_FLAGS $JCC_FLAGS"; fi
          gcc $BENCH_FLAGS $WARN_FLAGS -o branch_bench branch_bench.c

      - name: Build without perf support (non-Linux path)
        run: gcc $BENCH_FLAGS $WARN_FLAGS -U__linux__ -c -o /dev/null branch_bench.c

      # The C kernels are the fallback on other architectures; GCC with the
      # benchmark's flags must still keep their branches.
      - name: Build with the C kernels
        run: |
          gcc $BENCH_FLAGS $WARN_FLAGS -DBRANCH_BENCH_C_KERNELS -o bb_c branch_bench.c
          ./bb_c $SMALL_RUN > bb_c.out
          grep -q '^  Kernels: *C only' bb_c.out
          .github/scripts/check_kernels.sh ./bb_c

      - name: Run (small size)
        run: ./branch_bench $SMALL_RUN

      - name: Run all tests (small size, --hard)
        run: ./branch_bench --hard $SMALL_RUN

      - name: Perf regression tests (no PMU required)
        run: |
          gcc $BENCH_FLAGS $WARN_FLAGS -o "$RUNNER_TEMP/perf_test" .github/scripts/perf_test.c
          "$RUNNER_TEMP/perf_test"

      - name: Check the kernels keep their data branches and indirect calls
        run: .github/scripts/check_kernels.sh ./branch_bench

      # The export's kernel records declare each kernel's branch sites; the
      # binary must have exactly those.
      - name: Kernel descriptors match the binary
        run: |
          .github/scripts/check_kernels.sh --counts ./branch_bench > "$RUNNER_TEMP/counts.txt"
          ./branch_bench -t 1 --size 1K --reps 1 --json "$RUNNER_TEMP/k.jsonl" > /dev/null
          python3 .github/scripts/check_export.py "$RUNNER_TEMP/k.jsonl" --kernel-counts "$RUNNER_TEMP/counts.txt"

      # The fixture's kernel is branchless without any blacklisted
      # instruction, so this proves the data-branch check itself still fails.
      - name: Kernel check rejects a branchless fixture
        run: |
          gcc $BENCH_FLAGS $WARN_FLAGS -o "$RUNNER_TEMP/fixture" .github/scripts/branchless_fixture.c
          out="$RUNNER_TEMP/check_fixture.txt"
          .github/scripts/check_kernels.sh "$RUNNER_TEMP/fixture" > "$out" || true
          cat "$out"
          grep -q '^FAIL Test 1/4 .*expected 1 data branch(es), found 0' "$out"

      # Each fixture breaks the kernels in a way an older check accepted or
      # never looked for; the check must reject each with its own message.
      - name: Kernel check rejects a loop guard, unrolled loops and merged leaves
        run: |
          out="$RUNNER_TEMP/check_fixture.txt"
          for f in loop_guard unrolled asm_unrolled merged_leaves; do
            gcc $BENCH_FLAGS $WARN_FLAGS -o "$RUNNER_TEMP/$f" ".github/scripts/${f}_fixture.c"
            .github/scripts/check_kernels.sh "$RUNNER_TEMP/$f" > "$out" || true
            cat "$out"
            case $f in
              loop_guard)    grep -q '^FAIL Test 1/4 .*expected 1 data branch(es), found 0' "$out" ;;
              unrolled|asm_unrolled)
                             grep -q '^FAIL Test 1/4 .*expected 1 data branch(es), found [2-9]' "$out" ;;
              merged_leaves) grep -q '^FAIL Test 3 leaves: 31 distinct addresses for 32 leaves' "$out" ;;
            esac
          done

      # Built without $JCC_FLAGS, so its deliberately misplaced jump stays.
      - name: JCC check finds a jump ending on a 32-byte boundary
        if: runner.arch == 'X64'
        run: |
          gcc -o "$RUNNER_TEMP/jcc_fixture" .github/scripts/jcc_fixture.S
          hits=$(.github/scripts/check_jcc.sh "$RUNNER_TEMP/jcc_fixture")
          printf '%s\n' "$hits"
          [ "$(printf '%s\n' "$hits" | grep -c '^<sum_threshold> ')" -eq 1 ]
          [ "$(printf '%s\n' "$hits" | wc -l)" -eq 1 ]

      - name: Check no kernel jump crosses a 32-byte boundary
        if: runner.arch == 'X64'
        run: |
          hits=$(.github/scripts/check_jcc.sh ./branch_bench)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::kernel jumps cross or end on a 32-byte boundary (JCC erratum)"
            exit 1
          fi

  # Ubuntu 24.04's GCC 13 lags the GCC people build with locally, and codegen
  # (lost branches, jump layout) changes between versions.
  gcc-latest:
    name: GCC latest build and codegen (container)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check kernels
        run: |
          image=$(sed -n 's/^FROM //p' .github/gcc-latest/Dockerfile)
          docker run --rm -v "$PWD:/src:ro" -w /src \
            -e BENCH_FLAGS -e JCC_FLAGS -e WARN_FLAGS -e SMALL_RUN "$image" sh -ec '
              gcc --version
              gcc $BENCH_FLAGS $JCC_FLAGS $WARN_FLAGS -o /tmp/branch_bench branch_bench.c
              /tmp/branch_bench $SMALL_RUN > /dev/null
              /tmp/branch_bench --hard $SMALL_RUN > /dev/null
              .github/scripts/check_kernels.sh /tmp/branch_bench
              .github/scripts/check_kernels.sh --counts /tmp/branch_bench > /tmp/counts.txt
              /tmp/branch_bench -t 1 --size 1K --reps 1 --json /tmp/k.jsonl > /dev/null
              python3 .github/scripts/check_export.py /tmp/k.jsonl --kernel-counts /tmp/counts.txt
              hits=$(.github/scripts/check_jcc.sh /tmp/branch_bench)
              if [ -n "$hits" ]; then
                printf "%s\n" "$hits"
                echo "kernel jumps cross or end on a 32-byte boundary (JCC erratum)"
                exit 1
              fi'

  clang:
    name: Clang build and static analysis (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show compiler version
        run: clang --version

      - name: Build
        run: clang $CLANG_FLAGS $WARN_FLAGS -o branch_bench branch_bench.c

      - name: Run (small size)
        run: ./branch_bench $SMALL_RUN

      - name: Run all tests (small size, --hard)
        run: ./branch_bench --hard $SMALL_RUN

      # The asm kernels keep their branches under Clang too; only Test 6's C
      # kernel is still branchless (sbb/cmov, csel/cset on arm64) until
      # Stage 3 replaces it.  Its failure also proves the checker still
      # detects lost branches.
      - name: Clang keeps the controlled kernels' branches
        run: |
          out="$RUNNER_TEMP/check_kernels.txt"
          .github/scripts/check_kernels.sh ./branch_bench > "$out" || true
          cat "$out"
          [ "$(grep -c '^FAIL' "$out")" -ge 1 ]
          if grep '^FAIL' "$out" | grep -qv '^FAIL Test 6 '; then
            echo "check_kernels.sh rejected a controlled kernel in the Clang build"
            exit 1
          fi

      - name: clang --analyze
        run: |
          mkdir -p "$RUNNER_TEMP/analyze"
          cd "$RUNNER_TEMP/analyze"
          clang --analyze -std=c99 -Xclang -analyzer-werror "$GITHUB_WORKSPACE/branch_bench.c"

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan+UBSan, x86-64
            runner: ubuntu-24.04
            cc: gcc
            flags: -fno-tree-vectorize -fno-if-conversion -fsanitize=address,undefined
          - name: ASan+UBSan, arm64
            runner: ubuntu-24.04-arm
            cc: gcc
            flags: -fno-tree-vectorize -fno-if-conversion -fsanitize=address,undefined
          - name: MSan, x86-64
            runner: ubuntu-24.04
            cc: clang
            flags: -fno-vectorize -fno-slp-vectorize -fsanitize=memory -fsanitize-memory-track-origins
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # 86 instead of the default 1, so a sanitizer report can't pass as an
      # expected "invalid option" exit in smoke_test.sh.
      ASAN_OPTIONS: exitcode=86:detect_leaks=1
      UBSAN_OPTIONS: exitcode=86:halt_on_error=1:print_stacktrace=1
      MSAN_OPTIONS: exitcode=86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No -Werror: sanitizer instrumentation causes false-positive warnings
      # (e.g. -Wmaybe-uninitialized); warnings are enforced by the gcc job.
      - name: Build
        run: >
          ${{ matrix.cc }} -std=c99 -O1 -g -fno-omit-frame-pointer
          -fno-sanitize-recover=all ${{ matrix.flags }}
          -o branch_bench_san branch_bench.c

      - name: Smoke test
        run: .github/scripts/smoke_test.sh ./branch_bench_san "$RUNNER_TEMP/smoke"

      - name: Perf regression tests
        run: |
          ${{ matrix.cc }} -std=c99 -O1 -g -fno-omit-frame-pointer \
            -fno-sanitize-recover=all ${{ matrix.flags }} \
            -o "$RUNNER_TEMP/perf_test_san" .github/scripts/perf_test.c
          "$RUNNER_TEMP/perf_test_san"

  sonarqube:
    name: Coverage and SonarQube Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Only the scan step gets the token itself.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for SonarQube's blame and new-code data

      # requirements.txt pins gcovr and all its dependencies with hashes; pip
      # rejects any package that is missing from it or has another hash.
      - name: Install gcovr
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/pip" install --require-hashes -r .github/requirements.txt
          echo "$RUNNER_TEMP/gcovr/bin" >> "$GITHUB_PATH"

      - name: Install Build Wrapper
        id: build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

      # Lets the perf code paths run if this VM exposes a PMU; harmless if not.
      - name: Allow perf counters
        run: sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Build with coverage under Build Wrapper
        env:
          BUILD_WRAPPER: ${{ steps.build-wrapper.outputs.build-wrapper-binary }}
        run: >
          "$BUILD_WRAPPER"
          --out-dir build_wrapper_output
          gcc -std=c99 -O0 -g --coverage -fno-tree-vectorize -fno-if-conversion
          -DBUILD_FLAGS='"--coverage"' -DBUILD_COMMIT="\"$GITHUB_SHA\""
          -o branch_bench_cov branch_bench.c

      - name: Smoke test
        run: .github/scripts/smoke_test.sh ./branch_bench_cov "$RUNNER_TEMP/smoke"

      # The VM has no PMU or cpufreq, so fake them to cover those code paths.
      - name: Smoke test with faked perf counters and cpufreq
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -shared -fPIC \
            -o "$RUNNER_TEMP/fake_perf.so" .github/scripts/fake_perf.c -ldl
          export LD_PRELOAD="$RUNNER_TEMP/fake_perf.so"
          dir="$RUNNER_TEMP/smoke-fake"
          .github/scripts/smoke_test.sh ./branch_bench_cov "$dir"
          # Fails if the shim was not used: these lines need the counters.
          grep -q '^\*\*Effective extra cycles per additional miss:\*\* -\{0,1\}[0-9]' "$dir/report.md"
          grep -q '^\*\*Effective user-cycle rate during measurements:\*\*' "$dir/report.md"
          grep -q '^\*\*Periods at' "$dir/t5.md"
          grep -q '"governor":"performance"' "$dir/run.jsonl"
          grep -q '"hypervisor":true' "$dir/run.jsonl"
          grep -q '^\*\*Correlation used:\*\* d=4 [0-9][0-9]*%, d=8 n/a' "$dir/t6.md"
          grep -q '^_n/a: ' "$dir/t6.md"
          # Only some counters open.  Tests 1-2 come first: the shim fails the
          # first and third counter reads, and their four measurements absorb
          # them.  The Test 5-6 summaries need misses, and only misses.
          # check_export.py must accept both: the Test 6 line with misses,
          # its absence without.
          FAKE_PERF_EVENTS=misses ./branch_bench_cov -t 1 -t 2 -t 5 -t 6 $SMALL_RUN -o "$dir/part.md" --json "$dir/part.jsonl"
          grep -q '^\*\*Periods at' "$dir/part.md"
          grep -q '^\*\*Correlation used' "$dir/part.md"
          python3 .github/scripts/check_export.py "$dir/part.jsonl" --report "$dir/part.md"
          FAKE_PERF_EVENTS=branches,cycles ./branch_bench_cov -t 1 -t 2 -t 5 -t 6 $SMALL_RUN -o "$dir/part.md" --json "$dir/part.jsonl"
          python3 .github/scripts/check_export.py "$dir/part.jsonl" --report "$dir/part.md"
          if grep -q 'Periods at\|Correlation used' "$dir/part.md"; then
            echo "Test 5-6 summaries printed without the miss counter"; exit 1
          fi

      # Covers perf_stop()'s error paths, which need failing counter reads.
      - name: Perf regression tests with coverage
        run: |
          gcc -std=c99 -O0 -g --coverage -fno-tree-vectorize -fno-if-conversion \
            -o perf_test_cov .github/scripts/perf_test.c
          ./perf_test_cov

      # When no data matches the filter, gcovr writes an empty report and exits
      # 0; the minimum (the quality gate's 80%) makes that fail here instead.
      # perf_test.c renames main(), so --merge-lines counts each line once
      # instead of once per function name.
      - name: Coverage report
        run: >
          gcovr --root . --filter 'branch_bench\.c$' --merge-lines
          --sonarqube coverage.xml --print-summary --fail-under-line 80

      # Pull requests from forks get no secrets, and Dependabot's pull requests
      # get only Dependabot secrets, so SONAR_TOKEN must be both an Actions and
      # a Dependabot secret. The scan waits for the quality gate and fails the
      # job if it fails (sonar-project.properties).
      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Note skipped SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN != 'true'
        run: echo "::notice::SonarQube Cloud scan skipped (no SONAR_TOKEN, e.g. a pull request from a fork, or from Dependabot without the Dependabot secret)"
